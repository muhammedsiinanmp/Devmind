name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devmind
          POSTGRES_PASSWORD: devmind
          POSTGRES_DB: devmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values; there is no .env in CI.
      DJANGO_SECRET_KEY: ci-django-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      DATABASE_URL: postgresql://devmind:devmind@localhost:5432/devmind
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      DJANGO_ALLOW_ASYNC_UNSAFE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/django/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uvx ruff@0.17.3 check .
      - name: Format check (black)
        run: uv run black --check .
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: devmind.settings.test
      - name: Run tests
        run: uv run pytest --cov

  fastapi:
    name: FastAPI (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fastapi
    # No service containers and no secrets: tests/conftest disables the
    # .env file and sets fake keys before the app is imported.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/fastapi/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uvx ruff@0.17.3 check .
      - name: Format check (black)
        run: uv run black --check .
      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend (typecheck, build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (app)
        run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  compose:
    name: Compose (profiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use the env template
        run: cp .env.example .env
      - name: Ops tools run only under the ops profile
        run: |
          default=$(docker compose config --services | sort | tr '\n' ' ')
          ops_only=$(comm -13 <(docker compose config --services | sort) \
            <(docker compose --profile ops config --services | sort) | tr '\n' ' ')
          echo "default: $default"
          echo "ops only: $ops_only"
          test "$(docker compose config --profiles)" = "ops"
          test "$ops_only" = "flower grafana prometheus "
          for svc in migrate django fastapi celery_worker frontend; do
            echo "$default" | grep -qw "$svc"
          done

  evals:
    name: Evals (replay)
    # Replays the committed cassettes in backend/fastapi/evals/cassettes and
    # compares the scores with evals/results/after-fixes.json. No secrets and
    # no provider calls. Eval results never fail the job; it fails only if the
    # harness or the comparison can't run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check for review-agent or eval changes
        id: changes
        run: |
          # HEAD is the PR merge commit; its first parent is the base branch.
          changed=$(git diff --name-only HEAD^1 HEAD)
          pattern='^backend/fastapi/(agents|services|models|routers|core|evals)/|^backend/fastapi/scripts/eval_compare\.py$'
          if echo "$changed" | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Eval-relevant files changed:"
            echo "$changed" | grep -E "$pattern"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No review-agent or eval changes; eval replay skipped." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.run == 'true'
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        if: steps.changes.outputs.run == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: backend/fastapi/uv.lock
      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        working-directory: backend/fastapi
        run: uv sync --frozen
      - name: Replay evals from the committed cassettes
        if: steps.changes.outputs.run == 'true'
        run: |
          # Errored cases (e.g. cassette misses after a prompt change) make
          # the runner exit non-zero; the comparison reports them instead.
          make eval EVAL_ARGS="--results-dir $RUNNER_TEMP/evals --results-name current --allow-partial" \
            > "$RUNNER_TEMP/eval-replay.log" 2>&1 || echo "replay exited with $?"
          tail -n 40 "$RUNNER_TEMP/eval-replay.log"
          test -f "$RUNNER_TEMP/evals/current.json"
      - name: Compare with the committed after-fixes results
        if: steps.changes.outputs.run == 'true'
        working-directory: backend/fastapi
        run: |
          uv run python -m scripts.eval_compare evals/results/after-fixes.json \
            "$RUNNER_TEMP/evals/current.json" \
            --base-name "after-fixes.json" --current-name "this PR" \
            > "$RUNNER_TEMP/eval-report.md"
          cat "$RUNNER_TEMP/eval-report.md"
          cat "$RUNNER_TEMP/eval-report.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Note that fork PRs get no comment
        if: steps.changes.outputs.run == 'true' && github.event.pull_request.head.repo.full_name != github.repository
        run: echo "Pull request from a fork; the report is in the job summary only." | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Post or update the PR comment
        if: steps.changes.outputs.run == 'true' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/eval-report.md
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8');
            const marker = '<!-- devmind-eval-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.login === 'github-actions[bot]' && c.body?.startsWith(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated ${existing.html_url}`);
            } else {
              const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Created ${data.html_url}`);
            }
