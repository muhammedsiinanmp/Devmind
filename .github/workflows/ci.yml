name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/django
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: devmind
          POSTGRES_PASSWORD: devmind
          POSTGRES_DB: devmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Test-only values; there is no .env in CI.
      DJANGO_SECRET_KEY: ci-django-secret-key
      JWT_SECRET_KEY: ci-jwt-secret-key
      DATABASE_URL: postgresql://devmind:devmind@localhost:5432/devmind
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      DJANGO_ALLOW_ASYNC_UNSAFE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/django/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uvx ruff@0.17.3 check .
      - name: Format check (black)
        run: uv run black --check .
      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: devmind.settings.test
      - name: Run tests
        run: uv run pytest --cov

  fastapi:
    name: FastAPI (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fastapi
    # No service containers and no secrets: tests/conftest disables the
    # .env file and sets fake keys before the app is imported.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/fastapi/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint (ruff)
        run: uvx ruff@0.17.3 check .
      - name: Format check (black)
        run: uv run black --check .
      - name: Run tests
        run: uv run pytest

  frontend:
    name: Frontend (typecheck, build, lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check (app)
        run: pnpm exec tsc -p tsconfig.app.json --noEmit
      - name: Build
        run: pnpm build
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test
