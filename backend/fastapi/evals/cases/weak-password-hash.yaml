# Synthetic eval case written for DevMind. Line numbers are new-file lines.
id: weak-password-hash
description: Passwords are stored as unsalted MD5.
diff: |
  diff --git a/auth/passwords.py b/auth/passwords.py
  --- a/auth/passwords.py
  +++ b/auth/passwords.py
  @@ -3,2 +3,2 @@
   def hash_password(raw):
  -    return bcrypt.hashpw(raw.encode(), bcrypt.gensalt())
  +    return hashlib.md5(raw.encode()).hexdigest()
expected:
- file: auth/passwords.py
  line_range: [4, 4]
  category: security
  min_severity: error
