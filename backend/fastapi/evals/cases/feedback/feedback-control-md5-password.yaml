# Synthetic eval case written for DevMind. Line numbers are new-file lines.
# Feedback control (issue #74): the repository rejected "MD5 is weak" on a
# cache key, but here MD5 hashes passwords. The real bug must still be found.
id: feedback-control-md5-password
description: Passwords are hashed with unsalted MD5, although an earlier "MD5 is weak" comment on a cache key was rejected.
diff: |
  diff --git a/accounts/passwords.py b/accounts/passwords.py
  --- a/accounts/passwords.py
  +++ b/accounts/passwords.py
  @@ -1,3 +1,3 @@
   import hashlib
   def store_password(user, raw):
  -    user.password_hash = make_password(raw)
  +    user.password_hash = hashlib.md5(raw.encode()).hexdigest()
expected:
- file: accounts/passwords.py
  line_range: [3, 3]
  category: security
  min_severity: warning
feedback:
  rejected:
  - file_path: web/etag.py
    category: security
    severity: warning
    body: MD5 is a broken hash function. Use hashlib.sha256 instead.
    code: |
      @@ -8,2 +8,2 @@ def etag_for(body):
       def etag_for(body):
      -    return str(len(body))
      +    return hashlib.md5(body).hexdigest()
