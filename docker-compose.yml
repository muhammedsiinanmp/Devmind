services:

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: devmind
      POSTGRES_USER: devmind
      POSTGRES_PASSWORD: devmind_secret
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # One-shot: applies Django migrations (including the pgvector extension)
  # before the app services start, then exits.
  migrate:
    build:
      context: ./backend/django
      target: dev
    command: uv run python manage.py migrate --noinput
    env_file: .env
    volumes:
      - ./backend/django:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  django:
    build:
      context: ./backend/django
      target: dev
    command: uv run python manage.py runserver 0.0.0.0:8000
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    env_file: .env
    volumes:
      - ./backend/django:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  fastapi:
    build:
      context: ./backend/fastapi
      target: dev
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "${FASTAPI_PORT:-8001}:8001"
    env_file: .env
    volumes:
      - ./backend/fastapi:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery_worker:
    build:
      context: ./backend/django
      target: dev
    command: uv run celery -A devmind worker -l info -Q default,review,notifications
    volumes:
      - ./backend/django:/app
      - /app/.venv
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # Vite proxies /api to Django over the compose network
      - API_PROXY_TARGET=http://django:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - django

  # Ops tools start only with the "ops" profile: make up-ops
  flower:
    image: mher/flower:2.0
    profiles: [ops]
    # Same broker as the Celery worker: CELERY_BROKER_URL from .env (db 1)
    command: celery --broker=${CELERY_BROKER_URL:-redis://redis:6379/1} flower --port=5555
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    environment:
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-redis://redis:6379/1}
    depends_on:
      - redis
    restart: unless-stopped

  nginx:
    build: ./nginx
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - django
      - fastapi

  prometheus:
    image: prom/prometheus:latest
    profiles: [ops]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: [ops]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-devmind}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_FEATURE_TOGGLES_ENABLE=flamegraph
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  pg_data:
  prometheus_data:
  grafana_data:
